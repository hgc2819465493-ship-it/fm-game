<!doctype html>
<html lang="zh-Hant"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>綠茵經理</title><style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#091d18;color:#ecf7f0}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:auto;padding:28px 20px}h1{font-size:38px;margin:8px 0}h2{margin-top:12px}p{line-height:1.7;color:#b8cfc4}button,select{font:inherit;padding:10px 16px;border:1px solid #44665a;border-radius:8px;background:#173e31;color:white;margin:4px;cursor:pointer}button:hover{background:#24634a}button:disabled{opacity:.4;cursor:not-allowed}.primary{background:#b9ec76;color:#10261b;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px;margin:20px 0}.card{background:#102c23;border:1px solid #305246;border-radius:12px;padding:20px}.muted{color:#a8c4b6;font-size:14px}.badge{color:#c9ef93}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}td,th{text-align:left;padding:12px 9px;border-bottom:1px solid #294a3c}th{color:#b2d2c1}.selected{background:#204834}.score{font-size:42px;font-weight:800;text-align:center;padding:25px}.event{padding:10px;border-left:2px solid #5c8967;margin-left:12px}.notice{padding:12px;background:#344425;border-radius:8px;margin:12px 0}header{display:flex;justify-content:space-between;gap:15px;align-items:center;flex-wrap:wrap}.slot{display:inline-block;padding:8px;background:#183e31;border-radius:6px;margin:4px}a{color:#c5ed99}footer{margin-top:32px;color:#7fa38d;font-size:12px}</style></head><body><main id="app"></main><script>
'use strict';
const KEY='green-manager-v1', formations={'4-3-3':[4,3,3,1.08,.98,.95],'4-4-2':[4,4,2,1,1,1],'3-5-2':[3,5,2,1.02,1.08,.92]},posName={GK:'門將',DEF:'後衛',MID:'中場',FWD:'前鋒'},clubNames=['曼城','浙江隊','海港聯','江城競技','山城聯隊','濱海流浪'];
let state=null,screen='home',notice='',market='free';
const avg=a=>a.length?a.reduce((s,v)=>s+v,0)/a.length:0, clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),rand=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
function overall(p){return p.pos==='GK'?.7*p.def+.2*p.pas+.1*p.sta:p.pos==='DEF'?.55*p.def+.25*p.pas+.1*p.atk+.1*p.sta:p.pos==='MID'?.4*p.pas+.25*p.atk+.2*p.def+.15*p.sta:.55*p.atk+.25*p.pas+.1*p.def+.1*p.sta}
function player(id,teamId,pos,base,i){let p={id,teamId,pos,name:['林','周','許','沈','方','陸','程','葉','江','顧','唐','蘇'][i%12]+['啟航','北辰','景川','明遠','星河','承風','知岳','逸帆','雲舟','修竹','向陽','亦峰'][Math.floor(i/12)%12],age:rand(18,34)};for(let k of ['atk','pas','def','sta'])p[k]=clamp(base+rand(-2,2),1,20);p.value=Math.round(avg([p.atk,p.pas,p.def,p.sta])*80+(p.age<=23?40:p.age>=30?-30:0));return p}
function newGame(teamId){state={version:1,teamId,budget:teamId==='city'?800:500,week:0,formation:'4-3-3',tactic:'balanced',starters:[],teams:[],players:{},free:[],listings:[],transferOpen:false,lastReport:null,league:{teamIds:[],fixtures:[],table:[]}};let ids=['city','zhejiang','harbour','river','mountain','coast'];ids.forEach((id,t)=>{let team={id,name:clubNames[t],shortName:clubNames[t],isPlayer:id===teamId,budget:t===0?800:500,playerIds:[]};state.teams.push(team);state.league.teamIds.push(id);['GK',...Array(5).fill('DEF'),...Array(5).fill('MID'),...Array(5).fill('FWD')].forEach((pos,i)=>{let p=player(id+'-'+i,id,pos,[15,13,14,12,13,11][t],t*16+i);state.players[p.id]=p;team.playerIds.push(p.id)});if(id!==teamId)team.playerIds.slice(-2).forEach(pid=>state.listings.push({id:pid,price:Math.round(state.players[pid].value*1.1)}))});for(let i=0;i<10;i++){let p=player('free-'+i,null,['GK','DEF','MID','FWD'][i%4],rand(12,16),96+i);state.players[p.id]=p;state.free.push({id:p.id,price:120+i*10})}let rotation=[...ids];for(let round=0;round<5;round++){for(let j=0;j<3;j++){let pair=[rotation[j],rotation[5-j]];if(round%2)pair.reverse();state.league.fixtures.push({id:`${round}-${j}`,round,homeId:pair[0],awayId:pair[1],played:false,events:[]})}rotation.splice(1,0,rotation.pop())}autoXI();updateTable();save();screen='hub';render();return state}
function team(id){return state.teams.find(t=>t.id===id)}function roster(id=state.teamId){return team(id).playerIds.map(id=>state.players[id])}function available(p){return p.injuredRound!==state.week}function requirements(){let f=formations[state.formation];return {GK:1,DEF:f[0],MID:f[1],FWD:f[2]}}
function autoXI(){state.starters=[];for(let [pos,n]of Object.entries(requirements()))state.starters.push(...roster().filter(p=>p.pos===pos&&available(p)).sort((a,b)=>overall(b)-overall(a)).slice(0,n).map(p=>p.id));save()}
function validXI(){return state.starters.length===11&&new Set(state.starters).size===11&&Object.entries(requirements()).every(([pos,n])=>state.starters.filter(id=>state.players[id]?.pos===pos&&state.players[id].teamId===state.teamId&&available(state.players[id])).length===n)}
function toggle(id){let p=state.players[id];if(!available(p))return;let i=state.starters.indexOf(id);if(i>=0)state.starters.splice(i,1);else if(state.starters.filter(x=>state.players[x].pos===p.pos).length<requirements()[p.pos])state.starters.push(id);else notice='該位置已滿，請先取消一名首發。';save();render()}
function setFormation(f){state.formation=f;state.starters=[];notice=`槽位已變更：1 門將、${formations[f][0]} 後衛、${formations[f][1]} 中場、${formations[f][2]} 前鋒，請重新排陣。`;save();render()}
function save(){if(state)localStorage.setItem(KEY,JSON.stringify(state))}function load(){try{let s=JSON.parse(localStorage.getItem(KEY));if(s?.version===1&&s.league?.fixtures?.length===15){state=s;return true}}catch(e){}return false}
function lineup(id){return id===state.teamId?state.starters.map(x=>state.players[x]):['GK','DEF','MID','FWD'].flatMap((pos,i)=>roster(id).filter(p=>p.pos===pos&&available(p)).sort((a,b)=>overall(b)-overall(a)).slice(0,[1,4,4,2][i]))}
function powers(x,f,t,home){let mod=formations[f],ta=t==='attack'?1.12:t==='defend'?.9:1,td=t==='attack'?.9:t==='defend'?1.12:1,h=home?1.05:1;let weights={FWD:1,MID:.6,DEF:.2,GK:0};return {atk:x.reduce((s,p)=>s+p.atk*weights[p.pos],0)/x.reduce((s,p)=>s+weights[p.pos],0)*mod[3]*ta*h,mid:avg(x.filter(p=>p.pos==='MID').map(p=>p.pas))*mod[4]*h,def:avg(x.filter(p=>['DEF','GK'].includes(p.pos)).map(p=>p.def))*mod[5]*td*h}}
function weighted(x){let sum=x.reduce((s,p)=>s+p.atk,0),v=Math.random()*sum;return x.find(p=>(v-=p.atk)<0)||x[0]}
function simulate(m){let ids=[m.homeId,m.awayId],xs=ids.map(lineup),pw=xs.map((x,i)=>powers(x,ids[i]===state.teamId?state.formation:'4-4-2',ids[i]===state.teamId?state.tactic:'balanced',i===0)),goals=[0,0],shots=[0,0];let events=[{minute:0,type:'kickoff',text:'哨聲響起，比賽開始！'}];for(let segment=0;segment<9;segment++)for(let i=0;i<2;i++){let o=1-i;if(Math.random()<clamp(.35+.04*(pw[i].atk-pw[o].def)+.02*(pw[i].mid-pw[o].mid),.15,.75)){let pool=xs[i].filter(p=>p.pos==='FWD');if(!pool.length)pool=xs[i].filter(p=>p.pos==='MID');let shooter=weighted(pool),keeper=xs[o].find(p=>p.pos==='GK');let goal=Math.random()<clamp(.25+.03*(shooter.atk-(keeper?.def||10)),.08,.55);shots[i]++;if(goal)goals[i]++;events.push({minute:segment*10+rand(1,10),type:goal?'goal':'chance_missed',teamId:ids[i],playerId:shooter.id,text:goal?`⚽ ${team(ids[i]).name}・${shooter.name} 推射破門！`:`${team(ids[i]).name}・${shooter.name} 的射門被化解。`})}}events.push({minute:45,type:'half_time',text:'半場休息，雙方調整部署。'});if(Math.random()<.1){let i=rand(0,1),p=xs[i].find(p=>p.pos==='DEF');events.push({minute:rand(15,85),type:'yellow',teamId:ids[i],playerId:p.id,text:`🟨 ${p.name} 犯規領到黃牌。`})}for(let i=0;i<2;i++){if(Math.random()<.12){let candidates=xs[i].filter(p=>p.pos!=='GK'),p=candidates[rand(0,candidates.length-1)];p.injuredRound=state.week+1;events.push({minute:rand(55,89),type:'injury',teamId:ids[i],playerId:p.id,text:`${p.name} 輕傷，僅缺席下一輪。`})}xs[i].forEach(p=>p.fatiguedRound=state.week+1)}events.sort((a,b)=>a.minute-b.minute);events.push({minute:90,type:'full_time',text:`全場結束，比分 ${goals[0]} : ${goals[1]}。`});Object.assign(m,{played:true,homeGoals:goals[0],awayGoals:goals[1],events,shots,possession:[Math.round(100*pw[0].mid/(pw[0].mid+pw[1].mid)),0]});m.possession[1]=100-m.possession[0]}
function updateTable(){let rows=state.league.teamIds.map(teamId=>({teamId,played:0,w:0,d:0,l:0,gf:0,ga:0,pts:0}));for(let m of state.league.fixtures.filter(m=>m.played)){for(let [id,gf,ga]of [[m.homeId,m.homeGoals,m.awayGoals],[m.awayId,m.awayGoals,m.homeGoals]]){let r=rows.find(r=>r.teamId===id);r.played++;r.gf+=gf;r.ga+=ga;if(gf>ga){r.w++;r.pts+=3}else if(gf===ga){r.d++;r.pts++}else r.l++}}state.league.table=rows.sort((a,b)=>b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga)||b.gf-a.gf||a.teamId.localeCompare(b.teamId))}
function play(){if(state.week>=5||!validXI()){notice='請排滿符合陣型且沒有輕傷的 11 名首發。';render();return false}let matches=state.league.fixtures.filter(m=>m.round===state.week);for(let m of matches)simulate(m);state.lastReport=matches.find(m=>[m.homeId,m.awayId].includes(state.teamId)).id;state.week++;state.transferOpen=true;state.starters=state.starters.filter(id=>available(state.players[id]));updateTable();save();screen='match_report';render();return true}
function buy(id){let pool=state.free.some(p=>p.id===id)?state.free:state.listings,item=pool.find(p=>p.id===id);if(!state.transferOpen||!item||state.budget<item.price)return false;let p=state.players[id];if(p.teamId)team(p.teamId).playerIds=team(p.teamId).playerIds.filter(x=>x!==id);state.budget-=item.price;p.teamId=state.teamId;team(state.teamId).playerIds.push(id);pool.splice(pool.indexOf(item),1);state.transferOpen=false;notice=`已簽入 ${p.name}，本次轉會操作完成。`;save();render();return true}
const button=(label,action,disabled=false)=>`<button onclick="${action}" ${disabled?'disabled':''}>${label}</button>`;
function go(s){screen=s;notice='';render()}function tableHTML(){return `<div class="scroll"><table><tr><th>排名 / 球隊</th><th>場</th><th>勝</th><th>平</th><th>負</th><th>進</th><th>失</th><th>淨勝</th><th>積分</th></tr>${state.league.table.map((r,i)=>`<tr class="${r.teamId===state.teamId?'selected':''}"><td>${i+1}　${team(r.teamId).name}</td>${[r.played,r.w,r.d,r.l,r.gf,r.ga,r.gf-r.ga,r.pts].map(v=>`<td>${v}</td>`).join('')}</tr>`).join('')}</table></div>`}
function render(){let html='',rank=state?state.league.table.findIndex(r=>r.teamId===state.teamId)+1:0;if(screen==='home'){let has=false;try{has=!!JSON.parse(localStorage.getItem(KEY))?.version}catch(e){}html=`<p class="badge">MINI FM · 單機足球經理</p><h1>綠茵經理</h1><p>排好十一人，寫下你的五場聯賽故事。</p><div class="card">${button('新賽季',"go('pick_team')")}${button('繼續',"if(load())go('hub')",!has)}${button('玩法說明',"go('help')")}</div>`}
else if(screen==='pick_team')html=`<h2>選擇執教球隊</h2><p>六隊單循環，共五輪。球員全部為虛構人物。</p><div class="grid">${[['city','曼城','Man City',800,15],['zhejiang','浙江隊','Zhejiang FC',500,13]].map(([id,n,en,b,r])=>`<div class="card"><h2>${n}</h2><p>${en}</p><p>預算 ${b} 萬 · 綜合實力約 ${r}/20<br>${'★'.repeat(Math.round(r/4))}</p>${button('確認並開始',`newGame('${id}')`)}</div>`).join('')}</div>`;
else if(screen==='help')html=`<h2>玩法說明</h2><p>選隊後到「陣容」依位置設定十一名首發，再選陣型與戰術。前往「賽程」一次模擬九十分鐘，其他球隊也會同步比賽。勝三分、平一分，以積分、淨勝球、進球排名。</p><p>每場賽後可買一名自由球員或 AI 掛牌球員，未使用的機會不累積。自由球員以優惠簽約費加入；AI 標價為身價的 1.1 倍。輕傷僅缺席下一輪；連續首發的體力暫減 1（最低 8）。所有操作自動存檔。</p>${button('返回首頁',"go('home')")}`;
else {html=`<header><div><h1>綠茵經理</h1><p>${team(state.teamId).name} · 預算 <b>${state.budget}</b> 萬 · 已踢 ${state.week}/5 · 第 ${rank} 名</p></div>${button('經理中心',"go('hub')")}</header>`;if(notice)html+=`<div class="notice" role="status">${notice}</div>`;
if(screen==='hub')html+=`<h2>經理中心</h2><p>${state.week===5?'賽季已結束，查看最終排名或開始新的挑戰。':'準備下一場：先排陣，再帶領球隊出戰。'} ${state.transferOpen?'本次轉會窗開放，可購入一人。':''}</p>${state.week===5?button('查看賽季結果',"go('season_end')"):''}<div class="grid">${[['squad','陣容','選定首發十一人'],['tactics','戰術','陣型與攻守部署'],['fixtures','賽程','下一場與比賽戰報'],['table','積分榜','六隊即時排名'],['transfer','轉會','簽入新援'],['settings','設定','存檔與重開']].map(([s,n,d])=>`<div class="card"><h2>${n}</h2><p>${d}</p>${button('進入',`go('${s}')`)}</div>`).join('')}</div>`;
if(screen==='squad'){html+=`<h2>陣容 · ${state.formation}</h2><p>點擊球員設定或取消首發。輕傷僅缺席下一輪；體力顯示本輪可用值。</p>${Object.entries(requirements()).map(([p,n])=>`<span class="slot">${posName[p]} ${state.starters.filter(id=>state.players[id].pos===p).length}/${n}</span>`).join('')}${button('自動排陣','autoXI();render()')}${button('保存陣容',"save();notice='陣容已保存';render()")}${button('前往賽程',"go('fixtures')")}<div class="scroll"><table><tr><th>首發</th><th>姓名</th><th>位置</th><th>年齡</th><th>ATK</th><th>PAS</th><th>DEF</th><th>STA</th><th>綜合</th><th>身價 / 萬</th></tr>${roster().map(p=>`<tr class="${state.starters.includes(p.id)?'selected':''}"><td>${button(state.starters.includes(p.id)?'✓ 首發':'選入',`toggle('${p.id}')`,!available(p))}</td><td>${p.name}${!available(p)?' 🩹 下輪缺席':''}</td><td>${posName[p.pos]}</td><td>${p.age}</td><td>${p.atk}</td><td>${p.pas}</td><td>${p.def}</td><td>${p.fatiguedRound===state.week?Math.max(8,p.sta-1):p.sta}</td><td>${overall(p).toFixed(1)}</td><td>${p.value}</td></tr>`).join('')}</table></div>`}
if(screen==='tactics')html+=`<h2>戰術部署</h2><h3>陣型</h3>${Object.keys(formations).map(f=>button(`${state.formation===f?'✓ ':''}${f}`,`setFormation('${f}')`)).join('')}<p>4-3-3：進攻 ×1.08、中場 ×0.98、防守 ×0.95<br>4-4-2：三項均 ×1.00<br>3-5-2：進攻 ×1.02、中場 ×1.08、防守 ×0.92</p><h3>戰術強度</h3>${[['attack','進攻 Attack'],['balanced','均衡 Balanced'],['defend','防守 Defend']].map(([t,n])=>button(`${state.tactic===t?'✓ ':''}${n}`,`state.tactic='${t}';save();render()`)).join('')}<p>進攻：進攻 +12%、防守 −10%。均衡：無修正。防守：進攻 −10%、防守 +12%。主場三項戰力 +5%。</p>`;
if(screen==='fixtures')html+=`<h2>聯賽賽程</h2>${state.league.fixtures.filter(m=>[m.homeId,m.awayId].includes(state.teamId)).map(m=>`<div class="card"><span class="badge">第 ${m.round+1} 輪 ${!m.played&&m.round===state.week?'· 下一場':''}</span><h3>${team(m.homeId).name} ${m.played?`${m.homeGoals} : ${m.awayGoals}`:'vs'} ${team(m.awayId).name}</h3>${m.played?button('查看戰報',`state.lastReport='${m.id}';go('match_report')`):m.round===state.week?button('模擬本場','play()',!validXI()):'等待前輪完成'}</div>`).join('')}${!validXI()&&state.week<5?'<p class="notice">未排滿符合陣型的 11 人，請到陣容補齊首發（檢查輕傷）。</p>':''}`;
if(screen==='table')html+='<h2>積分榜</h2>'+tableHTML();
if(screen==='match_report'){let m=state.league.fixtures.find(m=>m.id===state.lastReport);html+=`<h2>比賽戰報 · 第 ${m.round+1} 輪</h2><div class="score">${team(m.homeId).name} ${m.homeGoals} : ${m.awayGoals} ${team(m.awayId).name}</div><div class="card">射門 ${m.shots[0]} : ${m.shots[1]}　｜　控球估算 ${m.possession[0]}% : ${m.possession[1]}%</div>${m.events.map(e=>`<div class="event"><b>${e.minute}′</b>　${e.text}</div>`).join('')}${button('回到經理中心',"go('hub')")}${state.week===5?button('賽季結束 · 查看排名',"go('season_end')"):''}`}
if(screen==='transfer'){let pool=market==='free'?state.free:state.listings;html+=`<h2>轉會市場</h2><p>${state.transferOpen?'轉會窗開放：可以標價購入一名球員。':'轉會窗關閉：每踢完一場可購買一次。'} 預算 ${state.budget} 萬。</p>${button('自由球員池',"market='free';render()")}${button('AI 俱樂部掛牌',"market='ai';render()")}${market==='free'?'<p>自由球員以優惠簽約費加盟；身價另列作能力參考。</p>':''}<div class="grid">${pool.map(item=>{let p=state.players[item.id];return `<div class="card"><h3>${p.name} · ${posName[p.pos]}</h3><p>${p.teamId?team(p.teamId).name:'自由身'} · ${p.age} 歲<br>ATK ${p.atk} / PAS ${p.pas} / DEF ${p.def} / STA ${p.sta}<br>綜合 ${overall(p).toFixed(1)} · 身價 ${p.value} 萬<br>標價 <b>${item.price} 萬</b></p>${button(state.budget<item.price?'預算不足':'購入',`buy('${p.id}')`,!state.transferOpen||state.budget<item.price)}</div>`}).join('')}</div>`}
if(screen==='settings')html+=`<h2>設定</h2><p>遊戲自動儲存於此瀏覽器。重開後，確認選隊才會覆蓋目前存檔。</p>${button('立即存檔',"save();notice='存檔成功';render()")}${button('返回首頁',"go('home')")}${button('重開新賽季',"go('pick_team')")}`;
if(screen==='season_end')html+=`<h2>賽季結束</h2><div class="card"><h2>冠軍：${team(state.league.table[0].teamId).name}</h2><p>${team(state.teamId).name} 最終排名：第 ${rank} 名 ${rank===1?'🏆 恭喜奪冠！':''}</p></div>${tableHTML()}${button('新賽季',"go('pick_team')")}${button('回經理中心',"go('hub')")}`;
}document.getElementById('app').innerHTML=html+'<footer>綠茵經理 · V1 · 虛構球員 / 六隊五輪 / 自動存檔</footer>'}
window.FM={newGame,autoXI,play,buy,setFormation,validXI,load,save,getState:()=>state};render();
</script></body></html>
